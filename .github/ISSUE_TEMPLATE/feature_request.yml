name: Feature Request
description: Suggest a new rule, config location, or workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should mcp-audit help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example MCP config or output
      description: Remove secrets before pasting.
      render: json
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New risk rule
        - New config location
        - Report output
        - CI / GitHub Action
        - Documentation
        - Other
